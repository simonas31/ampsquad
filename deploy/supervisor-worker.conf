; Supervisor programs for ampsquad.lt:
;   ampsquad-worker     queue worker (contact-form, order and customer account mail, media-library image conversions)
;
; Install steps: deploy/README.md ("Supervisor: queue worker and scheduler").
; Replace SITE_USER (the CloudPanel site user) before installing.
;
; Deploys run `artisan queue:restart`: the worker exits after its current job and
; Supervisor starts it again on the new code.

[program:ampsquad-worker]
process_name=%(program_name)s_%(process_num)02d
command=php8.5 /home/SITE_USER/htdocs/ampsquad.lt/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/home/SITE_USER/htdocs/ampsquad.lt
user=SITE_USER
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ampsquad-worker.log
